name: PMU chronological model training
on:
  push:
    paths:
      - "pmu_train.py"
      - ".github/workflows/pmu-training.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "datasets>=3.0,<4" pandas numpy scikit-learn lightgbm pyarrow
      - name: Train and evaluate
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python pmu_train.py
      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmu-model-metrics
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
